[project]
name = "dmswitch"
version = "0.1.0"
description = "Turn a macOS Space switch into a KVM switch: monitor input + keyboard/trackpad follow the desktop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Blinston S. Fernandes" }]
keywords = ["kvm", "macos", "hyprland", "wayland", "ddc", "spaces"]
dependencies = [
    "pyobjc-core>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dmswitch = "dmswitch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
